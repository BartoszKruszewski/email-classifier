[project]
name = "ai-message-router"
version = "0.1.0"
description = "PoC of an AI-powered message routing service using LangChain and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "langchain>=0.3.0",
    "langchain-core>=0.3.1",
    "langchain-ollama>=0.2.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "G"]
